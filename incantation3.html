
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gesture Sound Experience</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1.2.1/dist/ml5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ed8cb8;
      font-family: Arial, sans-serif;
      cursor: none;
    }

    canvas {
      display: block;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      background: rgba(20, 10, 30, 0.88);
      color: white;
      text-align: center;
      padding: 24px;
      cursor: default;
    }

    #startScreen h1 {
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 300;
      letter-spacing: 5px;
    }

    #startScreen p {
      max-width: 450px;
      line-height: 1.6;
      opacity: 0.8;
    }

    #startButton {
      border: 1px solid white;
      border-radius: 40px;
      padding: 16px 36px;
      background: transparent;
      color: white;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    #startButton:hover {
      background: white;
      color: #3b214d;
    }

    #status {
      position: fixed;
      left: 20px;
      bottom: 18px;
      z-index: 5;
      color: white;
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0.65;
      pointer-events: none;
    }

    #cornerLabels {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      color: white;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.65;
    }

    .corner {
      position: absolute;
      padding: 24px;
      line-height: 1.7;
    }

    .top-left { top: 0; left: 0; }
    .top-right { top: 0; right: 0; text-align: right; }
    .bottom-left { bottom: 0; left: 0; }
    .bottom-right { bottom: 0; right: 0; text-align: right; }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>TOUCH THE SOUND</h1>
    <p>
      Move your index finger through the space.
      Explore the four sound corners, create particles,
      and discover how movement changes the sound.
    </p>
    <button id="startButton">START EXPERIENCE</button>
  </div>

  <div id="cornerLabels">
    <div class="corner top-left">528 Hz<br>TRIANGLE</div>
    <div class="corner top-right">964 Hz<br>SAWTOOTH</div>
    <div class="corner bottom-left">174 Hz<br>SINE</div>
    <div class="corner bottom-right">432 Hz<br>TRIANGLE</div>
  </div>

  <div id="status">INITIALIZING CAMERA...</div>

<script>
/* =========================================
   GLOBAL VARIABLES
========================================= */

let video;
let handPose;
let hands = [];

let pointerX = 0;
let pointerY = 0;
let previousX = 0;
let previousY = 0;
let pointerSpeed = 0;

let particles = [];
let trackingReady = false;
let audioReady = false;

let oscillators = [];
let distortion;
let reverb;
let limiter;

let smoothedDistortion = 0.15;


/* =========================================
   P5 SETUP
========================================= */

function setup() {
  createCanvas(windowWidth, windowHeight);

  pointerX = width / 2;
  pointerY = height / 2;

  previousX = pointerX;
  previousY = pointerY;

  noCursor();

  video = createCapture(VIDEO, () => {
    document.getElementById("status").textContent =
      "CAMERA CONNECTED — SHOW YOUR HAND";
  });

  video.size(640, 480);
  video.hide();

  handPose = ml5.handPose({
    flipped: true
  });

  handPose.detectStart(video, gotHands);

  document.getElementById("startButton")
    .addEventListener("click", startExperience);
}


/* =========================================
   START AUDIO AND EXPERIENCE
========================================= */

async function startExperience() {
  const button = document.getElementById("startButton");

  button.textContent = "STARTING...";
  button.disabled = true;

  try {
    await startAudio();

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("status").textContent =
      "MOVE YOUR INDEX FINGER TO EXPLORE";

  } catch (error) {
    console.error("Audio initialization failed:", error);
    button.textContent = "CLICK TO TRY AGAIN";
    button.disabled = false;
  }
}


/* =========================================
   FOUR OSCILLATORS
========================================= */

async function startAudio() {
  await Tone.start();

  // Main distortion effect
  distortion = new Tone.Distortion({
    distortion: 0.15,
    oversample: "4x",
    wet: 1
  });

  // Reverb effect
  reverb = new Tone.Reverb({
    decay: 5,
    preDelay: 0.04,
    wet: 0.45
  });

  await reverb.generate();

  // Output protection
  limiter = new Tone.Limiter(-20);

  distortion.connect(reverb);
  reverb.connect(limiter);
  limiter.toDestination();

  const voices = [
    {
      name: "LOWER LEFT",
      frequency: 174,
      type: "sine",
      pan: -0.8,
      x: 0,
      y: 1
    },
    {
      name: "LOWER RIGHT",
      frequency: 432,
      type: "triangle",
      pan: 0.8,
      x: 1,
      y: 1
    },
    {
      name: "UPPER LEFT",
      frequency: 528,
      type: "triangle",
      pan: -0.8,
      x: 0,
      y: 0
    },
    {
      name: "UPPER RIGHT",
      frequency: 964,
      type: "sawtooth",
      pan: 0.8,
      x: 1,
      y: 0
    }
  ];

  voices.forEach((voice) => {
    const oscillator = new Tone.Oscillator({
      frequency: voice.frequency,
      type: voice.type
    });

    const gain = new Tone.Gain(0.025);
    const panner = new Tone.Panner(voice.pan);

    oscillator.connect(gain);
    gain.connect(panner);
    panner.connect(distortion);

    oscillator.start();

    oscillators.push({
      oscillator,
      gain,
      panner,
      ...voice
    });
  });

  audioReady = true;
}


/* =========================================
   HAND TRACKING
========================================= */

function gotHands(results) {
  hands = results;

  if (results.length > 0) {
    const fingertip = results[0].keypoints[8];

    const targetX = map(
      fingertip.x,
      0,
      video.width,
      0,
      width
    );

    const targetY = map(
      fingertip.y,
      0,
      video.height,
      0,
      height
    );

    pointerX = lerp(pointerX, targetX, 0.35);
    pointerY = lerp(pointerY, targetY, 0.35);

    trackingReady = true;

    document.getElementById("status").textContent =
      "HAND TRACKING ACTIVE";
  } else {
    trackingReady = false;

    document.getElementById("status").textContent =
      "SHOW YOUR HAND TO THE CAMERA";
  }
}


/* =========================================
   MAIN DRAW LOOP
========================================= */

function draw() {
  drawGradient();

  const speed = dist(
    pointerX,
    pointerY,
    previousX,
    previousY
  );

  pointerSpeed = lerp(pointerSpeed, speed, 0.25);

  if (trackingReady) {
    createParticles();
  }

  updateParticles();
  drawParticles();
  drawCursor();

  if (audioReady) {
    updateCornerSounds();
    updateDistortion();
  }

  previousX = pointerX;
  previousY = pointerY;
}


/* =========================================
   PINK TO PURPLE GRADIENT
========================================= */

function drawGradient() {
  const ctx = drawingContext;

  const gradient = ctx.createLinearGradient(
    0, 0,
    width, height
  );

  gradient.addColorStop(0, "#f18dbb");
  gradient.addColorStop(0.5, "#c16ab9");
  gradient.addColorStop(1, "#693c9b");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
}


/* =========================================
   PARTICLE CREATION
========================================= */

function createParticles() {
  const amount = Math.min(
    12,
    Math.floor(pointerSpeed / 2) + 1
  );

  for (let i = 0; i < amount; i++) {
    particles.push({
      x: pointerX + random(-8, 8),
      y: pointerY + random(-8, 8),
      size: random(3, 12),
      alpha: random(120, 230),
      life: 255,
      vx: random(-1.5, 1.5),
      vy: random(-1.5, 1.5)
    });
  }

  if (particles.length > 900) {
    particles.splice(0, particles.length - 900);
  }
}


/* =========================================
   PARTICLE MOVEMENT
========================================= */

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.life -= 2.2;
    p.alpha = p.life;

    p.size *= 0.994;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}


/* =========================================
   PARTICLE RENDERING
========================================= */

function drawParticles() {
  noStroke();

  for (const p of particles) {
    fill(255, 220, 245, p.alpha * 0.13);
    circle(p.x, p.y, p.size * 4);

    fill(255, 225, 250, p.alpha * 0.4);
    circle(p.x, p.y, p.size * 2);

    fill(255, 255, 255, p.alpha);
    circle(p.x, p.y, p.size);
  }
}


/* =========================================
   CUSTOM FINGER CURSOR
========================================= */

function drawCursor() {
  if (!trackingReady) return;

  push();

  noStroke();

  fill(255, 255, 255, 25);
  circle(pointerX, pointerY, 70);

  fill(255, 255, 255, 45);
  circle(pointerX, pointerY, 48);

  noFill();
  stroke(255, 255, 255, 190);
  strokeWeight(1.5);
  circle(pointerX, pointerY, 32);

  noStroke();
  fill(255, 255, 255, 240);
  circle(pointerX, pointerY, 9);

  pop();
}


/* =========================================
   FOUR-CORNER SOUND INTERACTION
========================================= */

function updateCornerSounds() {
  oscillators.forEach((voice) => {
    const cornerX = voice.x * width;
    const cornerY = voice.y * height;

    const distance = dist(
      pointerX,
      pointerY,
      cornerX,
      cornerY
    );

    const maxDistance = dist(
      0, 0,
      width, height
    );

    const proximity = 1 - constrain(
      distance / maxDistance,
      0,
      1
    );

    // Every voice remains audible.
    // Its level increases as the finger approaches its corner.
    const volume = 0.35 + proximity * 0.65;

    voice.gain.gain.rampTo(
      0.025 * volume,
      0.08
    );
  });
}


/* =========================================
   EDGE-RESPONSIVE DISTORTION
========================================= */

function updateDistortion() {
  const centerX = width / 2;
  const centerY = height / 2;

  const dx = Math.abs(pointerX - centerX) / centerX;
  const dy = Math.abs(pointerY - centerY) / centerY;

  const distance = Math.min(
    1,
    Math.max(dx, dy)
  );

  const targetDistortion =
    0.15 + Math.pow(distance, 0.65) * 0.84;

  smoothedDistortion = lerp(
    smoothedDistortion,
    targetDistortion,
    0.12
  );

  distortion.distortion = smoothedDistortion;
}


/* =========================================
   WINDOW RESIZING
========================================= */

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

</script>
</body>
</html>
