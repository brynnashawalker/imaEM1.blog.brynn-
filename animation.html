<!doctype html>
<htmllang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Sketch</title>
    <script src="https://cloudflare.com"></script>
<style>
@keyframes hotpinkToPurple {
  from {background-color: hotpink;}
  to {background-color: purple;}
}

/* standard syntax */
body {
  width: 100%;
  height: 100%;
background-color: hotpink;
animation-name: hotpinkToPurple;
    animation-duration: 4s;
    /*
    animation-direction values are
    normal - play forward and resets to start over
    reverse - plays backwards and resets to end state
    alternate - reverses direction each cycle, first is forward
    alternate-reverse - reverses direction each cycle, first is backwards
    */
    animation-direction: alternate-reverse;
    animation-iteration-count: infinite;
}
</style> 
</head>
<body>
<script src="sketch.js"></script>
</body>
</html>
