 <body>
  <script src="emitter.js"></script>
  <script src="particle.js"></script>
  <script src="sketch.js"></script>

    <!-- The Trigger Button -->
    <button id="soundButton" class="audio-btn">Play Repeating Sound</button>

    <!-- The Hidden Audio Element -->
    <audio id="myAudio" src="sound/speaker.fun.brynn~.mp3" preload="auto"></audio>

    <script>
        const button = document.getElementById('soundButton');
        const audio = document.getElementById('myAudio');

        // Force the audio to loop indefinitely
        audio.loop = true;

        button.addEventListener('click', () => {
            if (audio.paused) {
                // Play audio and update button text/style
                audio.play()
                    .then(() => {
                        button.textContent = "Stop Sound";
                        button.classList.add('playing');
                    })
                    .catch(error => {
                        console.error("Playback failed:", error);
                    });
            } else {
                // Pause audio, reset timeline to start, and reset button
                audio.pause();
                audio.currentTime = 0; 
                button.textContent = "Play Repeating Sound";
                button.classList.remove('playing');
            }
        });
    </script>
